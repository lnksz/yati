name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev fish \
            xvfb xauth xdotool imagemagick dbus-daemon

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test native GUI
        run: sh scripts/test-gui.sh

      - name: Build and test CLI without GUI dependencies
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go test ./...
